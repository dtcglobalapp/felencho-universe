<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Felencho Mundial · Hologram Engine</title>
<style>
html,body{width:100%;height:100%;padding:0;margin:0;overflow:hidden;background:#010510}
#scene{position:absolute;inset:0}
canvas{width:100%;height:100%;display:block}
</style>
</head>
<body><div id="scene" aria-label="Holographic character display"></div>
<script type="module">
const query=new URLSearchParams(location.search);
const character=query.get("character")==="lina"?"lina":"bob";
const panel=document.getElementById("scene");
const state={level:0,bass:0,mid:0,treble:0,weight:0,viseme:"REST",updated:0,session:"",sequence:-1};
try {
  let THREE;
  try { THREE=await import("https://esm.sh/three@0.180.0"); }
  catch(error) {
    console.warn("[Hologram Engine] Three.js CDN unavailable; enabling independent WebGL energy renderer",error);
    const {startFallbackEnergy}=await import("./fallback-energy.js");
    const canvas=document.createElement("canvas");
    panel.appendChild(canvas);
    startFallbackEnergy(canvas,character);
    // This is an intentional fallback completion; stop Three.js initialization.
    throw {fallbackActive:true};
  }
  const {buildEnergyEntity}=await import("./energy-entity.js");
  const scene=new THREE.Scene();
  scene.background=new THREE.Color("#010510");
  scene.fog=new THREE.FogExp2("#010510",.022);
  const camera=new THREE.PerspectiveCamera(34,window.innerWidth/window.innerHeight,.1,100);
  const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:"high-performance"});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.7));
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.48;
  renderer.setSize(innerWidth,innerHeight);
  panel.appendChild(renderer.domElement);
  const entity=buildEnergyEntity(THREE,character);
  scene.add(entity.root);
  const color=character==="lina"?0xa46dff:0x31dfff;
  const accent=character==="lina"?0xf557d6:0xffc268;
  scene.add(new THREE.AmbientLight(0x8d9dcb,.26));
  const key=new THREE.PointLight(color,42,12,1.35);
  key.position.set(-2.2,2.7,3.7);scene.add(key);
  const fill=new THREE.PointLight(accent,28,11,1.15);
  fill.position.set(2,-.5,2.5);scene.add(fill);
  const back=new THREE.PointLight(color,22,10,1.2);
  back.position.set(0,1.1,-2.2);scene.add(back);
  const dustCount=950,points=new Float32Array(dustCount*3);
  for(let i=0;i<dustCount;i++){
    const phi=i*2.39996323;
    const radius=2.45+(i%31)/31*4.1;
    points[i*3]=Math.cos(phi)*radius;
    points[i*3+1]=((i*31)%601)/601*8-4;
    points[i*3+2]=Math.sin(phi)*radius-1.7;
  }
  const dustGeo=new THREE.BufferGeometry();
  dustGeo.setAttribute("position",new THREE.BufferAttribute(points,3));
  const dust=new THREE.Points(dustGeo,new THREE.PointsMaterial({
    color,transparent:true,opacity:.35,size:.014,depthWrite:false,sizeAttenuation:true
  }));
  scene.add(dust);
  function resize(){
    camera.aspect=innerWidth/innerHeight;
    // Portrait TVs keep character framed center to upper body.
    camera.position.set(0,0,innerWidth<innerHeight?10.9:9.4);
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  }
  addEventListener("resize",resize);resize();
  addEventListener("message",(event)=>{
    if(event.origin!==location.origin || event.source!==window.parent)return;
    if(event.data?.type!=="felencho-hologram-frame")return;
    const f=event.data.frame;
    if(!f||f.character!==character||typeof f.timestamp!=="number"||Math.abs(Date.now()-f.timestamp)>5000)return;
    const finiteUnit=x=>typeof x==="number"&&Number.isFinite(x)&&x>=0&&x<=1;
    if(!["level","bass","mid","treble","weight"].every(k=>finiteUnit(f[k])))return;
    if(!["REST","A","E","I","O","U","M","F","L","S"].includes(f.viseme))return;
    if(typeof f.session!=="string"||typeof f.sequence!=="number")return;
    if(state.session===f.session&&f.sequence<=state.sequence)return;
    Object.assign(state,{level:f.active?f.level:0,bass:f.bass,mid:f.mid,
      treble:f.treble,weight:f.active?f.weight:0,viseme:f.active?f.viseme:"REST",
      updated:performance.now(),session:f.session,sequence:f.sequence});
  });
  const clock=new THREE.Clock();
  let stopped=false;
  function animate(){
    if(stopped)return;
    requestAnimationFrame(animate);
    const t=clock.getElapsedTime();
    if(performance.now()-state.updated>380){
      state.level*=.75;state.bass*=.75;state.mid*=.75;state.treble*=.75;
      state.weight*=.7;if(state.weight<.02)state.viseme="REST";
    }
    entity.update(t,state.level,state.bass,state.mid,state.treble,state.viseme,state.weight);
    dust.rotation.y=t*.006;
    key.intensity=38+state.level*38;
    fill.intensity=22+state.level*25;
    renderer.render(scene,camera);
  }
  requestAnimationFrame(animate);
  addEventListener("pagehide",()=>{stopped=true;entity.dispose();dustGeo.dispose();dust.material.dispose();renderer.dispose()},{once:true});
}catch(error){
  // Silent, TV-safe failure; diagnose in browser console, never place debug text on TV.
  if(!error?.fallbackActive){
    console.error("[Felencho Hologram Engine] WebGL render initialization failed",error);
    // Handle failures beyond the CDN (e.g. Three.js construction errors).
    if(!panel.querySelector("canvas")){
      try {
        const {startFallbackEnergy}=await import("./fallback-energy.js");
        const canvas=document.createElement("canvas");
        panel.appendChild(canvas);
        startFallbackEnergy(canvas,character);
      }catch(fallbackError){
        console.error("[Felencho Hologram Engine] Independent WebGL fallback failed",fallbackError);
      }
    }
  }
}
</script></body></html>
